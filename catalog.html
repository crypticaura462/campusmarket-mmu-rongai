<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog | CampusMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a class="brand" href="index.html">CampusMarket</a>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html" aria-current="page">Catalog</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-title">
      <h1>Catalog</h1>
      <p>Second-hand items from students, all priced in Kenyan shillings.</p>
    </section>

    <section class="controls" aria-label="Search and filter products">
      <div class="field">
        <label for="search">Search products</label>
        <input type="search" id="search" placeholder="try book or lamp">
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category">
          <option value="all">All categories</option>
          <option value="Textbooks">Textbooks</option>
          <option value="Electronics">Electronics</option>
          <option value="Dorm">Dorm</option>
          <option value="Stationery">Stationery</option>
        </select>
      </div>
    </section>

    <!-- the gallery just mirrors whatever the filter leaves visible below -->
    <section class="gallery-wrap" aria-label="Product gallery">
      <button type="button" id="gal-prev" class="gal-btn" aria-label="Previous image">&#10094;</button>
      <div class="gallery">
        <img id="gal-img" src="" alt="" width="280" height="200">
        <p id="gal-caption" class="gal-caption"></p>
      </div>
      <button type="button" id="gal-next" class="gal-btn" aria-label="Next image">&#10095;</button>
    </section>

    <section class="content" aria-labelledby="products-heading">
      <h2 id="products-heading">All products</h2>
      <p id="status" class="status-msg"></p>
      <div class="grid" id="product-grid"></div>
      <p id="no-results" class="no-results" hidden>Nothing matches that search, try something else.</p>
    </section>

    <section class="total-bar" aria-label="Order total" aria-live="polite">
      <p>Total:<strong id="total">KSh 0</strong></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>CampusMarket &copy; 2026. A semester project for CCS 2314 Web Based Programming II.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
